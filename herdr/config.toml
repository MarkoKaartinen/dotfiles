onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[terminal]
default_shell = "fish"

[keys]
prefix = "ctrl+a"
detach = "prefix+d"

[ui]
prompt_new_tab_name = false
status_indicators = "symbols"

[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace"], ["agent", "tab"]]

[ui.sound]
enabled = false

[ui.toast]
delivery = "off"
